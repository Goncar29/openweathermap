<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/openweathermap/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="App del clima - Busca el clima de cualquier ciudad"
    />
    <title>App Del Clima</title>
    <script type="module" crossorigin src="/openweathermap/assets/index-r-TEgc1R.js"></script>
    <link rel="stylesheet" crossorigin href="/openweathermap/assets/index-C9hOvV2y.css">
  </head>
  <body>
    <header>
      <h1>Busca la ciudad que quieras para obtener datos del clima</h1>
    </header>
    <main>
      <form id="form" action="">
        <label for="ciudad" class="visually-hidden">Nombre de la ciudad</label>
        <input
          class="form-input"
          type="text"
          id="ciudad"
          placeholder="Buscar ciudad"
          aria-label="Nombre de la ciudad"
          required
        />
        <button
          class="form-button"
          type="submit"
          id="obtenerClima"
          aria-label="Obtener información del clima"
        >
          Enviar
        </button>
      </form>
      <div
        id="resultados"
        aria-live="polite"
        aria-label="Resultados del clima"
      ></div>
    </main>
    <footer>
      <p>by @Goncar29</p>
    </footer>
  </body>
</html>
